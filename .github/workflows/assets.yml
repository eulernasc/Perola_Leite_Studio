name: Gerar identidade PWA e imagem de compartilhamento

on:
  push:
    branches: [desenvolvimento]
    paths:
      - 'assets/*.svg'
      - 'scripts/generate_brand_assets.py'
      - '.github/workflows/assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-imagens:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: desenvolvimento
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar renderizador
        run: python -m pip install 'cairosvg==2.7.1'
      - name: Renderizar PNGs
        run: python scripts/generate_brand_assets.py
      - name: Registrar ícones e prévia no desenvolvimento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png assets/icon-maskable-512.png assets/apple-touch-icon.png assets/favicon-32.png assets/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "build: atualizar ícones PWA e prévia social"
            git push origin HEAD:desenvolvimento
          else
            echo "Imagens já estão atualizadas."
          fi
