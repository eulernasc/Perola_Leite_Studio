name: Validar protótipo

on:
  push:
    branches:
      - desenvolvimento
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe JavaScript
        run: |
          node --check data.js
          node --check app.js
          node --check forms.js
          node --check calendar-ui.js
          node --check time-ui.js
          node --check pdf.js
          node --check pwa.js
          node --check cadastro.js
          node --check sw.js
          node --check tests/smoke.js
      - name: Validar regras de negócio
        run: node tests/smoke.js
