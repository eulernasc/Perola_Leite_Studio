name: Testar e publicar protótipo

on:
  push:
    branches:
      - desenvolvimento
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: perola-studio-pages
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe JavaScript
        run: |
          node --check data.js
          node --check app.js
          node --check forms.js
          node --check tests/smoke.js
      - name: Validar regras de negócio
        run: node tests/smoke.js
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html styles.css data.js app.js forms.js _site/
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar site estático
        id: deployment
        uses: actions/deploy-pages@v4
